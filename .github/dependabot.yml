version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /tools
      - /tools/workflow
    schedule:
      interval: weekly
      day: monday
      time: "00:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "00:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
