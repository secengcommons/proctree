name: Compatibility

on:
  workflow_call:
  schedule:
    - cron: '15 14 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOWORK: off

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      minimum: ${{ steps.matrix.outputs.minimum }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Compatibility Matrix
        id: matrix
        shell: bash
        run: |
          minimum=$(awk '$1 == "go" { print $2; exit }' go.mod)
          maximum=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2; exit }' go.mod)
          [[ "$minimum" =~ ^1\.([0-9]+)\.([0-9]+)$ ]]
          first=${BASH_REMATCH[1]}
          first_patch=${BASH_REMATCH[2]}
          [[ "$maximum" =~ ^1\.([0-9]+)\.([0-9]+)$ ]]
          last=${BASH_REMATCH[1]}
          last_patch=${BASH_REMATCH[2]}
          ((first < last || first == last && first_patch <= last_patch))
          ((last - first <= 10))
          versions=("\"$minimum\"")
          for ((minor = first + 1; minor < last; minor++)); do
            versions+=("\"1.$minor.0\"")
          done
          [[ "$minimum" == "$maximum" ]] || versions+=("\"$maximum\"")
          matrix=$(IFS=,; printf '{"version":[%s]}' "${versions[*]}")
          printf 'minimum=%s\n' "$minimum" >>"$GITHUB_OUTPUT"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"

  test:
    name: Go ${{ matrix.version }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go ${{ matrix.version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.version }}
          cache: false
      - name: Test Root Module
        run: go test -count=1 -shuffle=on ./...

  minimum-platforms:
    name: Minimum Go ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: freebsd, goarch: amd64}
          - {goos: netbsd, goarch: amd64}
          - {goos: openbsd, goarch: amd64}
          - {goos: dragonfly, goarch: amd64}
          - {goos: illumos, goarch: amd64}
          - {goos: solaris, goarch: amd64}
          - {goos: aix, goarch: ppc64}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Minimum Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.plan.outputs.minimum }}
          cache: false
      - name: Build Production and Tests
        run: bash ./.github/scripts/build-target.sh '${{ matrix.goos }}' '${{ matrix.goarch }}' 0
