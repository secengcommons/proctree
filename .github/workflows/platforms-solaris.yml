name: "Platforms: Solaris"

on:
  workflow_call:
  schedule:
    - cron: '15 15 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: platforms-solaris-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  GOWORK: off

jobs:
  test:
    name: Solaris 11.4 x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Reclaim Runner Disk
        run: sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet
      - name: Build Solaris Tests
        run: bash ./.github/scripts/build-vm-tests.sh solaris amd64
      - name: Test Solaris
        uses: vmactions/solaris-vm@96d8d976f9e67d82ec6c7e8ce9c1060731f9e21c # v1
        with:
          release: 11.4-gcc-14
          usesh: true
          copyback: false
          mem: 4096
          cpu: 2
          run: bash ./.github/scripts/test-vm.sh
