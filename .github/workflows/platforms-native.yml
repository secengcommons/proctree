name: "Platforms: Native"

on:
  workflow_call:
  schedule:
    - cron: '30 14 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: platforms-native-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  GOWORK: off

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Ubuntu 22.04 x64, runner: ubuntu-22.04, race: false}
          - {name: Ubuntu 24.04 x64, runner: ubuntu-24.04, race: true}
          - {name: Ubuntu 22.04 ARM64, runner: ubuntu-22.04-arm, race: false}
          - {name: Ubuntu 24.04 ARM64, runner: ubuntu-24.04-arm, race: true}
          - {name: Windows Server 2022 x64, runner: windows-2022, race: false}
          - {name: Windows Server 2025 x64, runner: windows-2025, race: true}
          - {name: Windows 11 ARM64, runner: windows-11-arm, race: false}
          - {name: macOS 14 ARM64, runner: macos-14, race: false}
          - {name: macOS 15 ARM64, runner: macos-15, race: true}
          - {name: macOS 26 ARM64, runner: macos-26, race: false}
          - {name: macOS 15 Intel, runner: macos-15-intel, race: true}
          - {name: macOS 26 Intel, runner: macos-26-intel, race: false}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test Root Module
        run: go test -count=1 -shuffle=on ./...
      - name: Test Race Behaviour
        if: matrix.race
        run: go test -race -count=1 -shuffle=on ./...
      - name: Test Windows Verification
        if: matrix.runner == 'windows-2025'
        shell: bash
        run: bash ./.github/scripts/test-verification.sh
