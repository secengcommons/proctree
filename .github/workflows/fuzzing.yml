name: Fuzzing

on:
  workflow_call:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  GOWORK: off
  FUZZTIME: ${{ github.event_name == 'schedule' && '60s' || '100000x' }}

jobs:
  root:
    name: Root
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Fuzz Driver
        shell: bash
        run: |
          temporary=$(mktemp -d "${RUNNER_TEMP}/proctree-fuzz-self-test.XXXXXX")
          case "$temporary" in
            "${RUNNER_TEMP}"/proctree-fuzz-self-test.*) ;;
            *) printf 'Unsafe fuzz self-test directory: %s\n' "$temporary" >&2; exit 1 ;;
          esac
          trap 'rm -rf -- "$temporary"' EXIT
          go_version=$(awk '$1 == "go" { print $2; exit }' go.mod)
          printf 'module fuzz.test/empty\n\ngo %s\n' "$go_version" >"$temporary/go.mod"
          printf 'package empty\n' >"$temporary/empty_test.go"
          if output=$(bash ./.github/scripts/test-fuzz.sh "$temporary" 2>&1); then
            printf 'Fuzz discovery accepted a module without a target\n' >&2
            exit 1
          fi
          grep -Fq "No fuzz targets were discovered in $temporary" <<<"$output"
          broken=$(mktemp -d "${RUNNER_TEMP}/proctree-fuzz-broken-test.XXXXXX")
          case "$broken" in
            "${RUNNER_TEMP}"/proctree-fuzz-broken-test.*) ;;
            *) printf 'Unsafe broken-package directory: %s\n' "$broken" >&2; exit 1 ;;
          esac
          trap 'rm -rf -- "$temporary" "$broken"' EXIT
          mkdir -- "$broken/broken"
          printf 'module fuzz.test/broken\n\ngo %s\n' "$go_version" >"$broken/go.mod"
          printf 'package broken\n\nimport (\n\t"os"\n\t"testing"\n)\n\nfunc FuzzValid(f *testing.F) { f.Fuzz(func(*testing.T, []byte) { _ = os.WriteFile("fuzz-ran", nil, 0o600) }) }\n' >"$broken/fuzz_test.go"
          printf 'package broken\n\nfunc invalid(\n' >"$broken/broken/broken_test.go"
          if output=$(FUZZTIME=1x bash ./.github/scripts/test-fuzz.sh "$broken" 2>&1); then
            printf 'Fuzz discovery accepted a broken package\n' >&2
            exit 1
          fi
          grep -Fq 'Fuzz target discovery failed for fuzz.test/broken/broken' <<<"$output"
          [[ ! -e "$broken/fuzz-ran" ]]
          valid=$(mktemp -d "${RUNNER_TEMP}/proctree-fuzz-valid-test.XXXXXX")
          case "$valid" in
            "${RUNNER_TEMP}"/proctree-fuzz-valid-test.*) ;;
            *) printf 'Unsafe valid-target directory: %s\n' "$valid" >&2; exit 1 ;;
          esac
          trap 'rm -rf -- "$temporary" "$broken" "$valid"' EXIT
          printf 'module fuzz.test/valid\n\ngo %s\n' "$go_version" >"$valid/go.mod"
          printf 'package valid\n\nimport (\n\t"os"\n\t"testing"\n)\n\nfunc FuzzValid(f *testing.F) { f.Fuzz(func(*testing.T, []byte) { _ = os.WriteFile("fuzz-ran", nil, 0o600) }) }\n' >"$valid/fuzz_test.go"
          FUZZTIME=1x bash ./.github/scripts/test-fuzz.sh "$valid"
          [[ -e "$valid/fuzz-ran" ]]
      - name: Fuzz Modules
        run: bash ./.github/scripts/test-fuzz.sh
