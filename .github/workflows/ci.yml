name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core
    uses: ./.github/workflows/core.yml
    permissions:
      contents: read

  compatibility:
    name: Compatibility
    uses: ./.github/workflows/compatibility.yml
    permissions:
      contents: read

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  fuzzing:
    name: Fuzzing
    uses: ./.github/workflows/fuzzing.yml
    permissions:
      contents: read

  ports:
    name: Go Ports
    uses: ./.github/workflows/ports.yml
    permissions:
      contents: read

  platforms-containers:
    name: "Platforms: Containers"
    uses: ./.github/workflows/platforms-containers.yml
    permissions:
      contents: read

  platforms-native:
    name: "Platforms: Native"
    uses: ./.github/workflows/platforms-native.yml
    permissions:
      contents: read

  platforms-virtual:
    name: "Platforms: Virtual"
    uses: ./.github/workflows/platforms-virtual.yml
    permissions:
      contents: read

  platforms-solaris:
    name: "Platforms: Solaris"
    uses: ./.github/workflows/platforms-solaris.yml
    permissions:
      contents: read

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - core
      - compatibility
      - security
      - fuzzing
      - ports
      - platforms-containers
      - platforms-native
      - platforms-virtual
      - platforms-solaris
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check Groups
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          if jq -e 'length > 0 and all(.[]; .result == "success")' <<<"$RESULTS" >/dev/null; then
            exit 0
          fi
          printf 'One or more CI groups failed\n' >&2
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS" >&2
          exit 1
