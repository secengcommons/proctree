name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/verify.yml@7a51b38ffab12b7310504762af02dd7e74805656 # v1.0.8
  linux:
    name: Linux
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/linux.yml@7a51b38ffab12b7310504762af02dd7e74805656 # v1.0.8
  windows:
    name: Windows
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/windows.yml@7a51b38ffab12b7310504762af02dd7e74805656 # v1.0.8
  macos:
    name: macOS
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/macos.yml@7a51b38ffab12b7310504762af02dd7e74805656 # v1.0.8
  fuzz:
    name: Fuzz
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/fuzz.yml@7a51b38ffab12b7310504762af02dd7e74805656 # v1.0.8
  ports:
    name: Go ports
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/ports.yml@7a51b38ffab12b7310504762af02dd7e74805656 # v1.0.8
  containers:
    name: Containers
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/containers.yml@7a51b38ffab12b7310504762af02dd7e74805656 # v1.0.8
  alpine:
    name: Alpine Linux
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/alpine.yml@7a51b38ffab12b7310504762af02dd7e74805656 # v1.0.8
  bsd:
    name: BSD
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/bsd.yml@7a51b38ffab12b7310504762af02dd7e74805656 # v1.0.8
  illumos:
    name: illumos
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/illumos.yml@7a51b38ffab12b7310504762af02dd7e74805656 # v1.0.8
  solaris:
    name: Solaris
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/solaris.yml@7a51b38ffab12b7310504762af02dd7e74805656 # v1.0.8
  dependencies:
    name: Dependencies
    if: github.event_name == 'pull_request'
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/dependencies.yml@7a51b38ffab12b7310504762af02dd7e74805656 # v1.0.8
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: secengcommons/ci/.github/workflows/codeql.yml@7a51b38ffab12b7310504762af02dd7e74805656 # v1.0.8
  benchmark:
    name: Benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run benchmarks
        run: go test -run=^$ -bench=. -benchmem ./...
  required:
    name: Required
    if: ${{ always() }}
    needs: [verify, linux, windows, macos, fuzz, ports, containers, alpine, bsd, illumos, solaris, dependencies, codeql, benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check jobs
        env:
          EVENT: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {name: "success" for name in results}
          if os.environ["EVENT"] != "pull_request":
              expected["dependencies"] = "skipped"
          failed = {name: result["result"] for name, result in results.items() if result["result"] != expected[name]}
          if failed:
              for name in sorted(failed):
                  print(f"{name}: {failed[name]}")
              raise SystemExit(1)
          PY
