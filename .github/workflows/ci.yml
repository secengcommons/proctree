name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/verify.yml@53ce8047adb206d19c75e2e49efcaf86932fa65b # v1.0.6
  linux:
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/linux.yml@53ce8047adb206d19c75e2e49efcaf86932fa65b # v1.0.6
  windows:
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/windows.yml@53ce8047adb206d19c75e2e49efcaf86932fa65b # v1.0.6
  macos:
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/macos.yml@53ce8047adb206d19c75e2e49efcaf86932fa65b # v1.0.6
  fuzz:
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/fuzz.yml@53ce8047adb206d19c75e2e49efcaf86932fa65b # v1.0.6
  ports:
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/ports.yml@53ce8047adb206d19c75e2e49efcaf86932fa65b # v1.0.6
  containers:
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/containers.yml@53ce8047adb206d19c75e2e49efcaf86932fa65b # v1.0.6
  alpine:
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/alpine.yml@53ce8047adb206d19c75e2e49efcaf86932fa65b # v1.0.6
  bsd:
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/bsd.yml@53ce8047adb206d19c75e2e49efcaf86932fa65b # v1.0.6
  illumos:
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/illumos.yml@53ce8047adb206d19c75e2e49efcaf86932fa65b # v1.0.6
  solaris:
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/solaris.yml@53ce8047adb206d19c75e2e49efcaf86932fa65b # v1.0.6
  dependencies:
    if: github.event_name == 'pull_request'
    permissions: {contents: read}
    uses: secengcommons/ci/.github/workflows/dependencies.yml@53ce8047adb206d19c75e2e49efcaf86932fa65b # v1.0.6
  codeql:
    permissions:
      contents: read
      security-events: write
    uses: secengcommons/ci/.github/workflows/codeql.yml@53ce8047adb206d19c75e2e49efcaf86932fa65b # v1.0.6
  required:
    name: Required
    if: ${{ always() }}
    needs: [verify, linux, windows, macos, fuzz, ports, containers, alpine, bsd, illumos, solaris, dependencies, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check jobs
        env:
          EVENT: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {name: "success" for name in results}
          if os.environ["EVENT"] != "pull_request":
              expected["dependencies"] = "skipped"
          failed = {name: result["result"] for name, result in results.items() if result["result"] != expected[name]}
          if failed:
              for name in sorted(failed):
                  print(f"{name}: {failed[name]}")
              raise SystemExit(1)
          PY
