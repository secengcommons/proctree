name: "Platforms: Containers"

on:
  workflow_call:
  schedule:
    - cron: '30 15 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: platforms-containers-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  GOWORK: off

jobs:
  alpine:
    name: Alpine 3.24.1 PID Namespace
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test Alpine Namespace Ownership
        run: bash ./.github/scripts/test-container.sh
